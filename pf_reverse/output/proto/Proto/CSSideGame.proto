syntax = "proto2";
package pb;

import "CSGameDef.proto";
message ColorGameBet
{
    optional int32 id = 1; // 101黄, 102灰, 103紫, 104蓝, 105红, 106绿
	optional int64 value = 2; // 总下注额
}

message ColorGameProfit
{
    optional int32 id = 1; // 101黄, 102灰, 103紫, 104蓝, 105红, 106绿
	optional int64 profit = 2; // 包含本金，未中奖时为零
}

message ColorGameActionREQ
{
	optional int32 from_game_type = 1; // 在什么地方玩color game；0大厅，非0则是具体玩法
	repeated ColorGameBet bets = 2;
	optional int32 lvl = 3; // 买入等级
}

message ColorGameActionRSP
{
    optional int32 code = 1;
	repeated ColorGameBet bets = 2; // 下注
	repeated ColorGameProfit profits = 3; // 结算
	repeated int32 ids = 4; // 结果id列表，颜色列表
}
message GetColorGameConfREQ
{

}
message GetColorGameConfRSP
{
    optional int32 code = 1;
	optional string conf = 2;//json格式
}
message PushGiftREQ
{
	optional int32 from_game_type = 1; // 在什么地方玩color game；0大厅，非0则是具体玩法
	optional int32 lvl = 2; // 买入等级 如果不是休闲游戏则直接推礼包id
	optional int32 game_type = 3;//游戏类型 30030101 color game 0获取当前礼包信息 1是已购买补码礼包
}
//推送礼包
message PushGiftRSP
{
	optional int32 code = 1;
	optional int32 gift_id = 2;//推送礼包id
	optional int32 game_type = 3;
    optional int64 end_time = 4;
}


//推送超值礼包
message PushRoomGiftREQ
{

}
//推送超值礼包
message PushRoomGiftRSP
{
    optional int32 code = 1;
    optional int32 gift_id = 2;//推送礼包id
    optional int64 end_time = 3;
    optional int32 game_type = 4;
}

//小游戏获取历史记录
message GetSideGameHisRecordREQ
{
	optional int32 game_type = 1;
}
// chips下注筹码 profit:纯利润(负数则是输)
// 30030101 - bet_data:[[{chips: 0,profit: 0,id:105}],],result:[[106,105],]
// 30080101 - bet_data:[{chips: 0,profit: 0,num: 10},],result:[[{export_id:1, rate:11},...],]
message GetSideGameHisRecordRSP
{
	optional int32 code = 1;
	optional int32 game_type = 2;
	optional string bet_data = 3;//    
	optional string result = 4;
}

// 获取小游戏配置
message GetSideGameConfREQ
{
    optional int32 game_type = 1; // 玩法类型
}
// tpl_conf: 玩法配置, 例如: tpl_color_game.lua中的P
// 30030101 - conf:{tpl_conf:{}}
// 30080101 - conf:{tpl_conf:{},balls:[1,2,3,5,10],export:[{export_id:1, rate:11},...]}
message GetSideGameConfRSP
{
    optional int32 code = 1;
    optional int32 game_type = 2;
    optional string conf = 3;//json格式
}

message PinballBallInfo
{
    optional int32 ball_id = 1;
    optional int32 export_id = 2; // 出口ID, 从左往右依次是1~9
    optional int64 reward = 3; // 奖励金额,连本带利
    optional int64 profit = 4; // 盈利, 即:奖励金额-下注金额, 可能为负数
}

message PinballActionResult
{
    optional int32 start_time = 1; // 开始发射小球的时间戳
    repeated PinballBallInfo balls = 2; // 小球信息列表
    optional int32 ball_fire_interval = 3; // 小球发射间隔，单位毫秒
    optional int32 per_ball_move_time = 4; // 每个小球移动时间，单位毫秒
    optional int32 from_game_type = 5; // 在什么地方玩color game；0大厅，非0则是具体玩法
}

message PinballActionREQ
{
    optional int32 from_game_type = 1; // 在什么地方玩color game；0大厅，非0则是具体玩法
    optional int32 lvl = 2; // 买入等级
    optional int64 per_bet = 3; // 每个球的下注金额
    optional int32 ball_num = 4; // 球的数量
}

message PinballActionRSP
{
    optional int32 code = 1;
    optional PinballActionResult action_result = 2;
}

message UpdateSwitchRSP
{
    optional int32 switch = 1;//开关值二进制存储
}



///////////////////////////////////////////////////小丑牌////////////////////////////////////////////

//席位卡牌
message SeatCard
{
    optional int32 seat = 1;     //席位
    optional int32 count = 2;    //计数
    optional int32 id = 3;       //卡牌id
}
//获取小丑牌信息
message GetClownInfoREQ
{

}
message GetClownInfoRSP
{
    optional int32 code = 1;
    optional int32 level = 2;            //当前关卡
    repeated SeatCard seat_cards = 3;    //席位卡牌
    optional int32 refresh = 4;          //剩余刷新次数
    optional int32 endless_times = 5;    //今日无尽关卡领取奖励次数
}

message Formula
{
    optional int32 type = 1;        //1是筹码 2是倍率
    optional int32 c_type = 2;      //1是加法 2是乘法
    optional int32 value = 3;       //值
}


//操作行为
message Operation
{
    optional int32 op = 1;          //1弃牌 2出牌
    repeated int32 cards = 2;       //手牌列表
    repeated int32 op_cards = 3;    //操作牌列表
    optional int32 card_type = 4;   //牌型
    repeated int32 ids = 5;         //触发的牌手id
    optional int64 get_score = 6;   //获取的分数
    repeated Formula formulas = 7; //计算公式
    optional int32 op_time = 8;    //操作时间戳
    optional int32 card_type_lv = 9;//牌型等级
    repeated int32 card_player_ids = 10;//当前牌手阵容
}

//本关结束上报
message GameOverREQ
{
    repeated Operation operations = 1;     //操作记录
}
message GameOverRSP
{
    optional int32 code = 1;
    optional int32 level = 2;            //当前关卡
    repeated ItemIdUnit rewards = 3;     // 奖励道具列表
    optional bool is_pass = 4;           //true 过关 false失败
    optional int32 endless_times = 5;    //今日无尽关卡领取奖励次数
    optional int64 his_score = 6;        //最高分数
}

//刷新席位卡牌
message RefreshSeatCardREQ
{
    optional int32 seat = 1;    //席位
}

message RefreshSeatCardRSP
{
    optional int32 code = 1;
    optional int32 refresh = 2;             //刷新次数
    optional int32 seat = 3;                //席位
    repeated SeatCard seat_cards = 4;       //刷新卡牌 如果在凌晨4点的时候刷新会存在解锁席位卡牌
}

//开始挑战
message StartChallengeREQ
{

}

message StartChallengeRSP
{
    optional int32 code = 1;        //0成功
    optional int32 level = 2;       //当前关卡
    optional string rand_seed = 3;  //随机种子
    repeated SeatCard seat_cards = 4;    //席位卡牌
}

//牌手位置变动
message CardPlayerSeatChangeREQ
{
    repeated int32 card_player_ids = 1;//当前牌手阵容
}

message CardPlayerSeatChangeRSP
{
    optional int32 code = 1;
}


/////////////////////////////大富翁活动协议/////////////////////////

message ThrowDiceREQ
{
    optional int32 multiple = 1; //倍数
}

message ThrowDiceRSP
{
    optional int32 code = 1;    
    optional int32 index = 2;        //格子排序 
    optional int32 multiple = 3;     //倍数
    optional int32 all_cost_num =  4;//骰子消耗总数
}

message GetProgressRewardREQ
{

}

message GetProgressRewardRSP
{
    optional int32 code = 1;
    optional int32 progress = 2;//已领取的进度
}

message GetMonopolyActDataREQ
{

}

message GetMonopolyActDataRSP
{
    optional int32 code = 1;    
    optional int32 index = 2;          //格子排序 
    optional int32 all_cost_num =  3;  //骰子消耗总数
    optional int32 progress = 4;       //已领取的进度
    optional int32 act_id = 5;         //当前活动id
}
