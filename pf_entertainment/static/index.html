<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f211b">
  <title>PokerFate 控制台</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="has-tabs">
  <header class="top">
    <span class="brand">PokerFate</span>
    <nav class="tabs" aria-label="页面">
      <a class="tab" href="#table" data-tab="table">
        <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="9.5" ry="6.2"/><path d="M9 12h6"/></svg>牌桌</a>
      <a class="tab" href="#money" data-tab="money">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 16.5l5-6 4 3.2 8-9.2"/><path d="M3.5 20.5h17"/></svg>资金</a>
      <a class="tab" href="#hands" data-tab="hands">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3.5" width="10.5" height="14.5" rx="2"/><path d="M9 21h8.5a2 2 0 0 0 2-2V8"/></svg>对局</a>
      <a class="tab" href="#radar" data-tab="radar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><path d="M12 12l5.6-5.6"/></svg>雷达</a>
    </nav>
    <div class="top-status"><span id="app-status" class="wide-only"></span></div>
  </header>

  <main>
    <section id="view-table" class="view">
      <div id="live-root"></div>
    </section>

    <section id="view-money" class="view" hidden>
      <div id="money-root"></div>
    </section>

    <section id="view-radar" class="view" hidden>
      <div id="radar-root"></div>
    </section>

    <section id="view-hands" class="view" hidden>
      <div class="hands">
        <div>
          <form class="filters" id="hand-filters">
            <select class="pick" name="vpip" aria-label="是否入池">
              <option value="yes">入池的手牌</option>
              <option value="all">全部手牌</option>
              <option value="no">没入池的</option>
            </select>
            <select class="pick" name="result" aria-label="结果">
              <option value="all">输赢不限</option>
              <option value="profit">赢的</option>
              <option value="loss">输的</option>
              <option value="zero">持平</option>
              <option value="incomplete">没打完</option>
            </select>
            <select class="pick" name="position" aria-label="位置">
              <option value="all">位置不限</option>
            </select>
            <select class="pick" name="bb_k" aria-label="盲注">
              <option value="all">盲注不限</option>
            </select>
            <input class="seek" name="board" type="search" inputmode="text" autocomplete="off"
                   placeholder="按公共牌找，如 A 2 5" aria-label="公共牌开头">
          </form>
          <div class="hands-meta">
            <span id="hands-count"></span>
            <div class="pager">
              <button type="button" id="hands-prev" aria-label="上一页">上一页</button>
              <span id="hands-page" class="num"></span>
              <button type="button" id="hands-next" aria-label="下一页">下一页</button>
            </div>
          </div>
          <div id="hand-list"><div class="hands-empty" aria-busy="true">正在读取对局记录</div></div>
        </div>
        <aside class="sheet" id="hand-sheet" aria-label="对局详情"><div class="sheet-empty">选一手牌，在这里逐街回看。</div></aside>
      </div>
    </section>
  </main>

  <script src="/static/live-table.js"></script>
  <script src="/static/live-money.js"></script>
  <script src="/static/live-views.js"></script>
  <script src="/static/radar-view.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
