<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f211b">
  <title>PokerFate 实时对局</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/live-table.js" defer></script>
  <script src="/static/live-money.js" defer></script>
  <script src="/static/live-views.js" defer></script>
  <script src="/static/live-remote.js" defer></script>
</head>
<body class="has-tabs">
  <header class="top">
    <span class="brand">PokerFate</span>
    <nav class="tabs" aria-label="页面">
      <a class="tab" href="#table" data-tab="table">
        <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="9.5" ry="6.2"/><path d="M9 12h6"/></svg>牌桌</a>
      <a class="tab" href="#money" data-tab="money">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 16.5l5-6 4 3.2 8-9.2"/><path d="M3.5 20.5h17"/></svg>资金</a>
    </nav>
    <div class="top-status">
      <span id="live-freshness">正在连接</span>
      <form method="post" action="/logout"><button type="submit" class="link-btn">退出登录</button></form>
    </div>
  </header>
  <main>
    <section id="view-table" class="view">
      <div id="live-root"></div>
    </section>
    <section id="view-money" class="view" hidden>
      <div id="money-root"></div>
    </section>
  </main>
</body>
</html>
